name: JavaScript checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/room-shape-editor]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node --check app.js
      - run: node --check editor.js
      - run: node --check geometry.js
